<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Monsnode Multi Player — Web</title>
  <script src="./config.js"></script>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eff1f5;background:#111318;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 20px;background:#191c23;border-bottom:1px solid #30343d}h1{margin:0;font-size:18px;white-space:nowrap}.search{display:flex;gap:8px;flex:1;max-width:820px}.search input{min-width:0;flex:1;padding:10px 12px;border:1px solid #454b57;border-radius:8px;background:#101217;color:inherit;font:inherit}.search button,.toolbar button{border:0;border-radius:8px;padding:10px 15px;background:#c4f26a;color:#19210e;font-weight:750;cursor:pointer}.search button:disabled{opacity:.6;cursor:wait}.toolbar{display:flex;align-items:center;gap:10px;margin:18px auto;max-width:1500px;padding:0 18px}.toolbar label,.toolbar span{color:#c6cad2}.toolbar select{padding:8px;border:1px solid #454b57;border-radius:7px;background:#20232a;color:#fff}.toolbar .secondary{background:#30343d;color:#f2f3f6}.toolbar button:disabled{opacity:.45;cursor:not-allowed}.status{max-width:1500px;margin:0 auto 14px;padding:0 18px;color:#aeb4c0}.status.error{color:#ffaaa6}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:1500px;margin:0 auto;padding:0 18px 24px}.card{overflow:hidden;border:1px solid #323741;border-radius:10px;background:#1b1e25}.card.selected{outline:2px solid #c4f26a}.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#08090b}.placeholder{display:grid;place-items:center;color:#808896}.card label{display:flex;gap:10px;align-items:flex-start;padding:10px;cursor:pointer}.card input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:#c4f26a}.title{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;line-height:1.4}.sentinel{grid-column:1/-1;height:2px}.player-view{position:fixed;inset:0;z-index:10;display:none;background:#07080a}.player-view.open{display:grid;grid-template-rows:auto 1fr}.player-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#171a20}.player-head h2{margin:0;font-size:15px}.player-grid{display:grid;gap:3px;min-height:0}.slot{position:relative;min-width:0;min-height:0;background:#000;overflow:hidden}.slot video{width:100%;height:100%;object-fit:contain}.slot-label{position:absolute;left:8px;top:8px;z-index:1;max-width:72%;padding:4px 7px;border-radius:5px;background:#000b;font-size:12px;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot-actions{position:absolute;right:8px;top:8px;z-index:2;display:flex;gap:5px}.slot-actions button,.close{border:1px solid #555b66;border-radius:7px;padding:7px 10px;background:#262a32;color:#fff;cursor:pointer}.close{padding:8px 12px}.empty{grid-column:1/-1;text-align:center;padding:20px;color:#aeb4c0}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.search{width:100%}.toolbar{flex-wrap:wrap;gap:7px}.toolbar button{padding:9px 10px}.results{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 10px 20px}.player-view.open{overflow:auto}.player-grid{grid-template-columns:1fr!important;grid-template-rows:none!important;overflow:auto}.slot{min-height:230px}}
  </style>
</head>
<body>
  <header>
    <h1>Monsnode Multi Player</h1>
    <form class="search" id="search-form"><input id="query" value="" aria-label="検索語" placeholder="検索語（空欄でトップページ）"><button id="search-button">検索</button></form>
  </header>
  <div class="toolbar">
    <label for="slot-count">同時再生数</label>
    <select id="slot-count" aria-label="同時再生数"><option value="1">1</option><option value="4" selected>4</option><option value="9">9</option><option value="16">16</option></select>
    <span id="selection-count">0 / 4 選択</span>
    <button class="secondary" id="clear">選択解除</button>
    <button id="open-selected" disabled>選択した動画を再生</button>
    <button id="open-auto" disabled>順に自動再生</button>
  </div>
  <p class="status" id="status" aria-live="polite">トップページの動画を読み込み中…</p>
  <main class="results" id="results"></main>
  <section class="player-view" id="player-view" aria-label="動画プレーヤー">
    <div class="player-head"><h2 id="player-title">Monsnode Multi Player</h2><button class="close" id="close-player">一覧に戻る</button></div>
    <div class="player-grid" id="player-grid"></div>
  </section>
  <script>
    const apiBase=(window.QUAD_API_BASE||'').replace(/\/$/,'');
    const selected=new Map(),resolved=new Map(),loadedIds=new Set(),videos=[];
    const results=document.querySelector('#results'),status=document.querySelector('#status'),countLabel=document.querySelector('#selection-count');
    const selectedButton=document.querySelector('#open-selected'),autoButton=document.querySelector('#open-auto'),playerView=document.querySelector('#player-view'),slotCount=document.querySelector('#slot-count');
    let activeQuery='',lastPage=0,hasMore=true,loadingPromise=null,searchGeneration=0,autoNextIndex=0;
    const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function targetCount(){return Number(slotCount.value)}
    function updateControls(){countLabel.textContent=`${selected.size} / ${targetCount()} 選択`;selectedButton.disabled=selected.size!==targetCount()||[...selected.values()].some(v=>!v.videoUrl);autoButton.disabled=videos.length===0&&!hasMore;}
    function updateGrid(){const grid=document.querySelector('#player-grid'),n=grid.children.length,side=Math.ceil(Math.sqrt(n||1));grid.style.gridTemplateColumns=`repeat(${side},minmax(0,1fr))`;grid.style.gridTemplateRows=`repeat(${side},minmax(0,1fr))`;}
    function renderCard(video){const card=document.createElement('article');card.className='card';const image=video.thumbnail?`<img class="thumb" loading="lazy" src="${esc(video.thumbnail)}" alt="">`:'<div class="thumb placeholder">Thumbnail unavailable</div>';card.innerHTML=`${image}<label><input type="checkbox" data-video-id="${esc(video.id)}" aria-label="動画を選択"><span class="title">${esc(video.title)}</span></label>`;const checkbox=card.querySelector('input');checkbox.checked=selected.has(video.id);card.classList.toggle('selected',checkbox.checked);checkbox.addEventListener('change',()=>selectVideo(video,card,checkbox));results.insertBefore(card,document.querySelector('#sentinel'));}
    function setStatus(text,error=false){status.textContent=text;status.className=error?'status error':'status';}
    async function getResolved(video){if(video.videoUrl)return video.videoUrl;if(resolved.has(video.redirectId))return resolved.get(video.redirectId);const task=(async()=>{const response=await fetch(`${apiBase}/resolve?id=${encodeURIComponent(video.redirectId)}`);const data=await response.json();if(!response.ok)throw new Error(data.diagnostic?`${data.error} Diagnostics: ${JSON.stringify(data.diagnostic)}`:(data.error||'動画リンクを取得できません。'));video.videoUrl=data.videoUrl;return data.videoUrl;})();resolved.set(video.redirectId,task);try{return await task}catch(error){resolved.delete(video.redirectId);throw error;}}
    async function selectVideo(video,card,checkbox){if(checkbox.checked&&selected.size>=targetCount()){checkbox.checked=false;setStatus(`動画は${targetCount()}本まで選択できます。`,true);return;}if(!checkbox.checked){selected.delete(video.id);card.classList.remove('selected');updateControls();return;}selected.set(video.id,video);card.classList.add('selected');setStatus(`動画リンクを取得中: ${video.title}`);updateControls();try{await getResolved(video);if(selected.get(video.id)===video){updateControls();setStatus('選択した動画のリンクを取得しました。')}}catch(error){if(selected.get(video.id)===video){selected.delete(video.id);checkbox.checked=false;card.classList.remove('selected');updateControls();setStatus(error.message,true)}}}
    async function loadNextPage(){if(!apiBase){setStatus('config.js にCloudflare WorkerのURLを設定してください。',true);return false;}if(!hasMore)return false;if(loadingPromise)return loadingPromise;const generation=searchGeneration;const page=lastPage+1;loadingPromise=(async()=>{try{const params=new URLSearchParams({q:activeQuery,page:String(page)});const response=await fetch(`${apiBase}/search?${params}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'検索に失敗しました。');if(generation!==searchGeneration)return false;let added=0;for(const video of data.videos){if(loadedIds.has(video.id))continue;loadedIds.add(video.id);videos.push(video);renderCard(video);added++;}lastPage=page;if(!added)hasMore=false;if(data.videos.length===0)hasMore=false;setStatus(`${videos.length} 件を表示中${hasMore?'。下へスクロールすると続きが読み込まれます。':'。これ以上の動画はありません。'}`);updateControls();return added>0}catch(error){if(generation===searchGeneration){hasMore=false;setStatus(error.message,true);updateControls()}return false}finally{loadingPromise=null}})();return loadingPromise;}
    async function startSearch(event){event?.preventDefault();searchGeneration++;activeQuery=document.querySelector('#query').value.trim();lastPage=0;hasMore=true;loadingPromise=null;videos.length=0;loadedIds.clear();selected.clear();resolved.clear();results.replaceChildren();results.innerHTML='<div class="sentinel" id="sentinel"></div>';updateControls();setStatus('検索結果を取得しています…');await loadNextPage();}
    const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&hasMore)loadNextPage()},{rootMargin:'700px'});document.querySelector('#search-form').addEventListener('submit',startSearch);document.querySelector('#sentinel')&&observer.observe(document.querySelector('#sentinel'));new MutationObserver(()=>{const sentinel=document.querySelector('#sentinel');if(sentinel&&!sentinel.dataset.observed){sentinel.dataset.observed='1';observer.observe(sentinel)}}).observe(results,{childList:true});
    async function nextAutoVideo(){while(autoNextIndex>=videos.length&&hasMore)await loadNextPage();if(autoNextIndex>=videos.length)return null;return videos[autoNextIndex++]}
    async function putVideoInSlot(slot,video,shouldPlay=true){slot.current=video;slot.label.textContent=video.title;slot.video.pause();slot.video.removeAttribute('src');slot.video.load();try{const directUrl=await getResolved(video);if(slot.current!==video)return;const src=`${apiBase}/media?src=${encodeURIComponent(directUrl)}`;slot.video.src=src;slot.video.load();if(shouldPlay)await slot.video.play()}catch(error){if(slot.current===video){const mediaError=slot.video.error;const detail=mediaError?` (media error ${mediaError.code}${mediaError.message?`: ${mediaError.message}`:''})`:'';slot.label.textContent=`${video.title} — ${error.message}${detail}`;setStatus(`${error.message}${detail}`,true)}}}
    async function advanceSlot(slot){const video=await nextAutoVideo();if(!video){setStatus('一覧の動画をすべて再生しました。');return}slot.history.push(video);await putVideoInSlot(slot,video,true)}
    function makeSlot(video,index,auto){const element=document.createElement('div');element.className='slot';element.innerHTML=`<span class="slot-label"></span>${auto?'<span class="slot-actions"><button type="button" class="back">Back</button><button type="button" class="next">Next</button></span>':''}<video controls playsinline preload="metadata"></video>`;const slot={element,video:element.querySelector('video'),label:element.querySelector('.slot-label'),history:[],current:null};if(auto){slot.history.push(video);element.querySelector('.next').addEventListener('click',()=>advanceSlot(slot));element.querySelector('.back').addEventListener('click',async()=>{if(slot.history.length<2)return;slot.history.pop();await putVideoInSlot(slot,slot.history.at(-1),true)});slot.video.addEventListener('ended',()=>advanceSlot(slot))}return slot}
    async function openPlayer(list,auto){if(list.length!==targetCount())return;const grid=document.querySelector('#player-grid');grid.replaceChildren();playerView.classList.add('open');document.querySelector('#player-title').textContent=auto?'Monsnode Multi Player · Auto':'Monsnode Multi Player';autoNextIndex=targetCount();const slots=list.map((v,i)=>makeSlot(v,i,auto));for(const slot of slots)grid.append(slot.element);updateGrid();await Promise.all(slots.map((slot,index)=>putVideoInSlot(slot,list[index],true)));}
    selectedButton.addEventListener('click',()=>openPlayer([...selected.values()],false));autoButton.addEventListener('click',async()=>{autoButton.disabled=true;const initial=[];while(initial.length<targetCount()){const video=await nextAutoVideo();if(!video)break;initial.push(video)}if(initial.length<targetCount()){autoNextIndex=0;setStatus(`再生には${targetCount()}本必要です。動画を追加で読み込めませんでした。`,true);updateControls();return}openPlayer(initial,true).then(()=>setStatus('順に自動再生中です。各動画は終了時またはNextで次へ進みます。'));updateControls()});
    slotCount.addEventListener('change',()=>{while(selected.size>targetCount()){const last=[...selected.keys()].at(-1);selected.delete(last);const input=document.querySelector(`.card input[data-video-id="${CSS.escape(last)}"]`);if(input){input.checked=false;input.closest('.card').classList.remove('selected')}}updateControls()});
    document.querySelector('#clear').addEventListener('click',()=>{selected.clear();document.querySelectorAll('.card input').forEach(input=>{input.checked=false;input.closest('.card').classList.remove('selected')});updateControls()});
    function closePlayer(){playerView.classList.remove('open');document.querySelector('#player-grid').replaceChildren()}document.querySelector('#close-player').addEventListener('click',closePlayer);document.addEventListener('keydown',event=>{if(event.key==='Escape')closePlayer()});
    if(location.protocol==='file:')setStatus('ローカルファイルを直接開かず、GitHub PagesのURLから開いてください。',true);else startSearch();
  </script>
</body>
</html>
