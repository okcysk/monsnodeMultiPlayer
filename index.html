<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Monsnode Quad Player — Web試作</title>
  <script src="./config.js"></script>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eff1f5;background:#111318;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 20px;background:#191c23;border-bottom:1px solid #30343d}h1{margin:0;font-size:18px;white-space:nowrap}.search{display:flex;gap:8px;flex:1;max-width:820px}.search input{min-width:0;flex:1;padding:10px 12px;border:1px solid #454b57;border-radius:8px;background:#101217;color:inherit;font:inherit}.search button,.toolbar button{border:0;border-radius:8px;padding:10px 15px;background:#c4f26a;color:#19210e;font-weight:750;cursor:pointer}.search button:disabled{opacity:.6;cursor:wait}.toolbar{display:flex;align-items:center;gap:10px;margin:18px auto;max-width:1500px;padding:0 18px}.toolbar span{color:#c6cad2}.toolbar .secondary{background:#30343d;color:#f2f3f6}.status{max-width:1500px;margin:0 auto 14px;padding:0 18px;color:#aeb4c0}.status.error{color:#ffaaa6}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:1500px;margin:0 auto;padding:0 18px 24px}.card{overflow:hidden;border:1px solid #323741;border-radius:10px;background:#1b1e25}.card.selected{outline:2px solid #c4f26a}.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#08090b}.placeholder{display:grid;place-items:center;color:#808896}.card label{display:flex;gap:10px;align-items:flex-start;padding:10px;cursor:pointer}.card input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:#c4f26a}.title{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;line-height:1.4}.player-view{position:fixed;inset:0;z-index:10;display:none;background:#07080a}.player-view.open{display:grid;grid-template-rows:auto 1fr}.player-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#171a20}.player-head h2{margin:0;font-size:15px}.player-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:3px;min-height:0}.slot{position:relative;min-width:0;min-height:0;background:#000}.slot video{width:100%;height:100%;object-fit:contain}.slot-label{position:absolute;left:8px;top:8px;z-index:1;max-width:75%;padding:4px 7px;border-radius:5px;background:#000a;font-size:12px;pointer-events:none}.close{border:1px solid #555b66;border-radius:7px;padding:8px 12px;background:#262a32;color:#fff;cursor:pointer}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.search{width:100%}.toolbar{flex-wrap:wrap}.results{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 10px 20px}.player-grid{grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));overflow:auto}.slot{min-height:180px}}
  </style>
</head>
<body>
  <header><h1>Monsnode Quad Player <small>· Web試作</small></h1><form class="search" id="search-form"><input id="query" value="jap" aria-label="検索語" placeholder="検索語"><input id="page" type="number" min="1" value="1" aria-label="ページ" style="max-width:90px"><button id="search-button">検索</button></form></header>
  <div class="toolbar"><span id="selection-count">0 / 4 選択</span><button class="secondary" id="clear">選択解除</button><button id="play" disabled>選択した4本を再生</button></div>
  <p class="status" id="status" aria-live="polite">読み込み中…</p>
  <main class="results" id="results"></main>
  <section class="player-view" id="player-view" aria-label="4分割プレーヤー"><div class="player-head"><h2>Monsnode Quad Player</h2><button class="close" id="close-player">検索結果に戻る</button></div><div class="player-grid" id="player-grid"></div></section>
  <script>
    const selected=new Map();const results=document.querySelector('#results');const status=document.querySelector('#status');const count=document.querySelector('#selection-count');const play=document.querySelector('#play');const playerView=document.querySelector('#player-view');
    const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function update(){count.textContent=`${selected.size} / 4 選択`;play.disabled=selected.size!==4||[...selected.values()].some(v=>!v.videoUrl);}
    async function selectVideo(video,card,checkbox){
      if(checkbox.checked&&selected.size>=4){checkbox.checked=false;status.textContent='動画は4本まで選択できます。';status.className='status error';return;}
      if(!checkbox.checked){selected.delete(video.id);card.classList.remove('selected');update();return;}
      const item={...video,videoUrl:''};selected.set(item.id,item);card.classList.add('selected');status.className='status';status.textContent=`動画リンクを解決中: ${item.title}`;update();
      try{const api=(window.QUAD_API_BASE||'').replace(/\/$/,'');const response=await fetch(`${api}/resolve?id=${encodeURIComponent(item.redirectId)}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'動画リンクを取得できません。');if(selected.get(item.id)===item){item.videoUrl=data.videoUrl;status.textContent='選択した動画のリンクを取得しました。';update();}}
      catch(error){if(selected.get(item.id)===item){selected.delete(item.id);checkbox.checked=false;card.classList.remove('selected');status.className='status error';status.textContent=error.message;update();}}
    }
    async function search(event){event?.preventDefault();const api=(window.QUAD_API_BASE||'').replace(/\/$/,'');if(!api){status.className='status error';status.textContent='config.js に Cloudflare Worker のURLを設定してください。';return;}const button=document.querySelector('#search-button');button.disabled=true;status.className='status';status.textContent='検索結果を取得しています…';results.replaceChildren();
      try{const params=new URLSearchParams({q:document.querySelector('#query').value,page:document.querySelector('#page').value});const response=await fetch(`${api}/search?${params}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'検索に失敗しました。');
        for(const video of data.videos){const card=document.createElement('article');card.className='card';const image=video.thumbnail?`<img class="thumb" loading="lazy" src="${esc(video.thumbnail)}" alt="">`:'<div class="thumb placeholder">Thumbnail unavailable</div>';card.innerHTML=`${image}<label><input type="checkbox" aria-label="動画を選択"><span class="title">${esc(video.title)}</span></label>`;const checkbox=card.querySelector('input');checkbox.addEventListener('change',()=>selectVideo(video,card,checkbox));results.append(card);}
        status.textContent=`${data.videos.length} 件の動画が見つかりました。4本にチェックを入れてください。`;
      }catch(error){status.className='status error';status.textContent=error.message;}finally{button.disabled=false;}}
    document.querySelector('#search-form').addEventListener('submit',search);
    document.querySelector('#clear').addEventListener('click',()=>{selected.clear();document.querySelectorAll('.card input').forEach(input=>{input.checked=false;input.closest('.card').classList.remove('selected')});update();});
    play.addEventListener('click',()=>{if(play.disabled)return;const videos=[...selected.values()];document.querySelector('#player-grid').innerHTML=videos.map((video,index)=>`<div class="slot"><span class="slot-label">${esc(video.title)}</span><video src="${esc(video.videoUrl)}" controls autoplay playsinline preload="metadata" title="Video ${index+1}"></video></div>`).join('');playerView.classList.add('open');});
    function closePlayer(){playerView.classList.remove('open');document.querySelector('#player-grid').replaceChildren();}document.querySelector('#close-player').addEventListener('click',closePlayer);document.addEventListener('keydown',event=>{if(event.key==='Escape')closePlayer();});
    if(location.protocol==='file:'){status.className='status error';status.textContent='ローカルファイルを直接開かず、GitHub PagesのURLから開いてください。';}else search();
  </script>
</body>
</html>
