x;background:#1b1e25}.card.selected{outline:2px solid #c4f26a}.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#08090b}.placeholder{display:grid;place-items:center;color:#808896}.card label{display:flex;gap:10px;align-items:flex-start;padding:10px;cursor:pointer}.card input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:#c4f26a}.title{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;line-height:1.4}.sentinel{grid-column:1/-1;height:2px}.player-view{position:fixed;inset:0;z-index:10;display:none;background:#07080a}.player-view.open{display:grid;grid-template-rows:auto 1fr}.player-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#171a20}.player-head h2{margin:0;font-size:15px}.key-help{flex:1;color:#aeb4c0;font-size:12px}.player-grid{display:grid;gap:3px;min-height:0}.slot{position:relative;min-width:0;min-height:0;background:#000;overflow:hidden}.slot.keyboard-focus{outline:3px solid #c4f26a;outline-offset:-3px}.slot video{width:100%;height:100%;object-fit:contain}.slot-label{position:absolute;left:8px;top:8px;z-index:1;max-width:72%;padding:4px 7px;border-radius:5px;background:#000b;font-size:12px;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot-speed{position:absolute;left:8px;bottom:36px;z-index:2;padding:3px 6px;border-radius:4px;background:#000b;color:#fff;font-size:12px;pointer-events:none}.slot-actions{position:absolute;right:8px;top:8px;z-index:2;display:flex;gap:5px}.slot-actions button,.close{border:1px solid #555b66;border-radius:7px;padding:7px 10px;background:#262a32;color:#fff;cursor:pointer}.close{padding:8px 12px}.empty{grid-column:1/-1;text-align:center;padding:20px;color:#aeb4c0}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.search{width:100%}.contacts{margin-left:0;flex-wrap:wrap}.toolbar{flex-wrap:wrap;gap:7px}.toolbar button{padding:9px 10px}.results{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 10px 20px}.player-view.open{overflow:auto}.player-grid{overflow:auto}.slot{min-height:230px}.key-help{display:none}}
    .periods{display:flex;gap:5px;flex:none}.periods button{border:1px solid #454b57;border-radius:7px;padding:9px 11px;background:#252932;color:#e8ebf0;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.periods button.active{border-color:#c4f26a;background:#c4f26a;color:#19210e}.periods button:disabled{opacity:.55;cursor:wait}.player-grid{background:#000}.thumb{user-select:none;-webkit-user-drag:none}.player-head{flex-wrap:wrap}.share-actions{display:flex;align-items:center;gap:6px}.share-actions button{border:1px solid #555b66;border-radius:7px;padding:7px 9px;background:#262a32;color:#fff;font:600 12px system-ui,sans-serif;cursor:pointer}.share-actions button:hover{border-color:#c4f26a;color:#c4f26a}.share-actions button:disabled{opacity:.45;cursor:wait}@media(max-width:900px){header{flex-wrap:wrap}.search{max-width:none}.periods{margin-left:auto}}@media(max-width:700px){.periods{margin-left:0}.share-actions{order:3;width:100%;justify-content:flex-end}.player-head{gap:8px}}

<body>
  <header>
    <h1><a class="brand-link" href="https://monsnode.com/" target="_blank" rel="noopener noreferrer">Monsnode</a> Multi Player <small>v1.3.22</small></h1>
    <form class="search" id="search-form"><input id="query" value="" aria-label="検索語" placeholder="検索語（空欄でトップページ）"><button id="search-button">検索</button></form>
    <nav class="periods" aria-label="動画一覧の期間"><button type="button" data-period="new" class="active">new</button><button type="button" data-period="24h">24h</button><button type="button" data-period="3d">3d</button><button type="button" data-period="7d">7d</button></nav>
    <nav class="contacts" aria-label="連絡先"><a href="mailto:okcysk@gmail.com"><span class="contact-icon" aria-hidden="true">✉</span>okcysk@gmail.com</a><a href="https://x.com/okcysk46770" target="_blank" rel="noopener noreferrer"><span class="contact-icon" aria-hidden="true">𝕏</span>@okcysk46770</a></nav>
  </header>
  <div class="toolbar">
    <label for="slot-count">同時再生数</label>
    <select id="slot-count" aria-label="同時再生数"><option value="1">1</option><option value="4" selected>4</option><option value="9">9</option><option value="16">16</option></select>
    <span id="selection-count">0 / 4 選択</span>
    <button class="secondary" id="clear">選択解除</button>
    <button id="open-selected" disabled>選択した動画を再生</button>
    <button id="open-auto" disabled>順に自動再生</button>
  </div>
  <p class="status" id="status" aria-live="polite">トップページの動画を読み込み中…</p>
  <main class="results" id="results"></main>
  <section class="player-view" id="player-view" aria-label="動画プレーヤー">
    <div class="player-head"><h2 id="player-title"><a class="brand-link" href="https://monsnode.com/" target="_blank" rel="noopener noreferrer">Monsnode</a> Multi Player <span class="player-version">v1.3.22</span></h2><span class="key-help">Tab / W A S D: 動画選択 · B / N: 前後の動画 · Z / X: 5秒 · C / V: 30秒 · ↑ / ↓: 音量 ±0.1 · M: ミュート · Shift+M: 全体ミュート · F: 等速 · G: 2.5倍 · H: 10倍 · Space: 再生/停止 · Shift+Space: 全体再生/停止</span><nav class="share-actions" aria-label="共有"><button type="button" id="copy-share" disabled>リンクをコピー</button><button type="button" id="share-x" disabled>X</button><button type="button" id="share-line" disabled>LINE</button><button type="button" id="share-threads" disabled>Threads</button></nav><button class="close" id="close-player">一覧に戻る</button></div>
    <div class="player-grid" id="player-grid"></div>
  </section>
  <script>
    const apiBase=(window.QUAD_API_BASE||'').replace(/\/$/,'');
    const selected=new Map(),resolved=new Map(),loadedIds=new Set(),videos=[];
    const results=document.querySelector('#results'),status=document.querySelector('#status'),countLabel=document.querySelector('#selection-count');
    const selectedButton=document.querySelector('#open-selected'),autoButton=document.querySelector('#open-auto'),playerView=document.querySelector('#player-view'),slotCount=document.querySelector('#slot-count');
    let activeQuery='',activePeriod='new',lastPage=0,hasMore=true,loadingPromise=null,searchGeneration=0,autoNextIndex=0,selectionAnchorId=null,dragSelection=null,suppressClickAfterDrag=false;
    const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function targetCount(){return Number(slotCount.value)}
    function countCapacity(count){return count<=1?1:count<=4?4:count<=9?9:16}
    function encodeShareState(state){const bytes=new TextEncoder().encode(JSON.stringify(state));let binary='';for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
    function decodeShareState(value){try{const base64=value.replace(/-/g,'+').replace(/_/g,'/'),binary=atob(base64+'='.repeat((4-base64.length%4)%4)),bytes=Uint8Array.from(binary,char=>char.charCodeAt(0)),state=JSON.parse(new TextDecoder().decode(bytes));if(state?.v!==1||![1,4,9,16].includes(Number(state.n))||!Array.isArray(state.slots))return null;return{...state,slots:state.slots.slice(0,16).map((item,index)=>{if(!item||typeof item.u!=='string')return null;try{const media=new URL(item.u);return media.protocol==='https:'&&media.hostname==='video.twimg.com'&&/\.mp4$/i.test(media.pathname)?{...item,i:Number.isInteger(item.i)?item.i:index}:null}catch{return null}}).filter(Boolean)}}catch{return null}}
    let shareTimer=null;
    function updateShareUrl(){if(!playerView.classList.contains('open'))return;const slots=[...document.querySelectorAll('#player-grid .slot')].map(element=>{const slot=element._slot;if(!slot?.directUrl)return null;return{i:slot.shareIndex??slot.order,u:slot.directUrl,t:slot.current?.title||'',p:Number.isFinite(slot.video.currentTime)?slot.video.currentTime:0,r:slot.video.playbackRate||1,m:slot.video.muted}});const state={v:1,n:targetCount(),c:slots.length,slots};const url=new URL(location.href);url.hash=`share=${encodeShareState(state)}`;history.replaceState(null,'',url)}
    function startShareTracking(){clearInterval(shareTimer);shareTimer=setInterval(updateShareUrl,1000);updateShareUrl()}
    async function shareCurrentUrl(){updateShareUrl();const url=location.href;try{await navigator.clipboard.writeText(url);const button=document.querySelector('#copy-share'),label=button.textContent;button.textContent='コピーしました';setTimeout(()=>button.textContent=label,1400)}catch{prompt('このリンクをコピーしてください',url)}}
    function shareTo(service){updateShareUrl();const url=encodeURIComponent(location.href),text=encodeURIComponent('Monsnode Multi Player');const links={x:`https://twitter.com/intent/tweet?url=${url}&text=${text}`,line:`https://social-plugins.line.me/lineit/share?url=${url}`,threads:`https://www.threads.net/intent/post?text=${text}%20${url}`};window.open(links[service],'_blank','noopener,noreferrer')}
    function syncCapacityToSelection(){slotCount.value=String(selected.size?countCapacity(selected.size):4)}
    function updateControls(){countLabel.textContent=`${selected.size} / ${targetCount()} 選択`;selectedButton.disabled=selected.size===0||selected.size>16||selected.size>targetCount()||[...selected.values()].some(v=>!v.videoUrl);autoButton.disabled=videos.length===0&&!hasMore;}
    function updateGrid(count=targetCount()){const grid=document.querySelector('#player-grid'),n=Math.max(grid.children.length,count),side=Math.ceil(Math.sqrt(n||1));grid.style.gridTemplateColumns=`repeat(${side},minmax(0,1fr))`;grid.style.gridTemplateRows=`repeat(${side},minmax(0,1fr))`;}
    function renderCard(video){const card=document.createElement('article');card.className='card';const image=video.thumbnail?`<img class="thumb" loading="lazy" src="${esc(video.thumbnail)}" alt="">`:'<div class="thumb placeholder">Thumbnail unavailable</div>';card.innerHTML=`${image}<label><input type="checkbox" data-video-id="${esc(video.id)}" aria-label="動画を選択"><span class="title">${esc(video.title)}</span></label>`;const checkbox=card.querySelector('input');checkbox.checked=selected.has(video.id);card.classList.toggle('selected',checkbox.checked);checkbox.addEventListener('click',event=>{if(suppressClickAfterDrag){event.preventDefault();suppressClickAfterDrag=false;return}if(!event.shiftKey)return;event.preventDefault();void selectVideoRange(selectionAnchorId||video.id,video.id)});checkbox.addEventListener('change',()=>{selectionAnchorId=video.id;void selectVideo(video,card,checkbox)});results.insertBefore(card,document.querySelector('#sentinel'));}
    results.addEventListener('click',event=>{const card=event.target.closest('.card'),checkbox=card?.querySelector('input[data-video-id]');if(!checkbox)return;if(suppressClickAfterDrag){event.preventDefault();suppressClickAfterDrag=false;return}if(event.target.closest('input'))return;if(event.shiftKey){event.preventDefault();void selectVideoRange(selectionAnchorId||checkbox.dataset.videoId,checkbox.dataset.videoId);return}if(!event.target.closest('.thumb'))return;event.preventDefault();checkbox.checked=!checkbox.checked;selectionAnchorId=checkbox.dataset.videoId;const video=videos.find(item=>item.id===checkbox.dataset.videoId);if(video)void selectVideo(video,card,checkbox)});
    results.addEventListener('dblclick',event=>{const target=event.target.closest('.thumb,input[type="checkbox"]');if(!target)return;event.preventDefault();event.stopPropagation();const card=target.closest('.card'),checkbox=card?.querySelector('input[data-video-id]'),index=videos.findIndex(video=>video.id===checkbox?.dataset.videoId);if(index<0)return;autoNextIndex=index+1;void openPlayer([videos[index]],true).then(()=>setStatus(`「${videos[index].title}」から1画面で順に自動再生します。`))});
    function setStatus(text,error=false){status.textContent=text;status.className=error?'status error':'status';}
    async function getResolved(video){if(video.videoUrl)return video.videoUrl;if(resolved.has(video.redirectId))return resolved.get(video.redirectId);const task=(async()=>{const response=await fetch(`${apiBase}/resolve?id=${encodeURIComponent(video.redirectId)}`);const data=await response.json();if(!response.ok)throw new Error(data.diagnostic?`${data.error} Diagnostics: ${JSON.stringify(data.diagnostic)}`:(data.error||'動画リンクを取得できません。'));video.videoUrl=data.videoUrl;return data.videoUrl;})();resolved.set(video.redirectId,task);try{return await task}catch(error){resolved.delete(video.redirectId);throw error;}}
    async function selectVideo(video,card,checkbox){if(checkbox.checked&&selected.size>=16){checkbox.checked=false;setStatus('動画は16本まで選択できます。',true);return;}if(!checkbox.checked){selected.delete(video.id);card.classList.remove('selected');syncCapacityToSelection();updateControls();return;}selected.set(video.id,video);card.classList.add('selected');syncCapacityToSelection();setStatus(`動画リンクを取得中: ${video.title}`);updateControls();try{await getResolved(video);if(selected.get(video.id)===video){updateControls();setStatus('選択した動画のリンクを取得しました。')}}catch(error){if(selected.get(video.id)===video){selected.delete(video.id);checkbox.checked=false;card.classList.remove('selected');syncCapacityToSelection();updateControls();setStatus(error.message,true)}}}
    async function selectVideoRange(anchorId,endId){let start=videos.findIndex(video=>video.id===anchorId),end=videos.findIndex(video=>video.id===endId);if(end<0)return;if(start<0)start=end;const low=Math.min(start,end),high=Math.max(start,end),tasks=[];for(const video of videos.slice(low,high+1)){if(selected.has(video.id))continue;if(selected.size>=16){setStatus('動画は16本まで選択できます。',true);break;}const checkbox=results.querySelector(`input[data-video-id="${CSS.escape(video.id)}"]`);if(!checkbox)continue;checkbox.checked=true;tasks.push(selectVideo(video,checkbox.closest('.card'),checkbox));}await Promise.all(tasks)}
    results.addEventListener('pointerdown',event=>{if(event.shiftKey||event.button!==0||!event.target.closest('.thumb,input[type="checkbox"]'))return;const card=event.target.closest('.card'),checkbox=card?.querySelector('input[data-video-id]');if(!checkbox)return;dragSelection={anchorId:checkbox.dataset.videoId,lastId:checkbox.dataset.videoId,x:event.clientX,y:event.clientY,moved:false}});
    document.addEventListener('pointermove',event=>{if(!dragSelection||!(event.buttons&1))return;if(Math.abs(event.clientX-dragSelection.x)+Math.abs(event.clientY-dragSelection.y)<6)return;if(!dragSelection.moved)selectionAnchorId=dragSelection.anchorId;dragSelection.moved=true;event.preventDefault();const card=document.elementFromPoint(event.clientX,event.clientY)?.closest('.card'),checkbox=card?.querySelector('input[data-video-id]');if(!checkbox||checkbox.dataset.videoId===dragSelection.lastId)return;dragSelection.lastId=checkbox.dataset.videoId;void selectVideoRange(dragSelection.anchorId,dragSelection.lastId)});
    document.addEventListener('pointerup',()=>{const moved=dragSelection?.moved;dragSelection=null;if(moved){suppressClickAfterDrag=true;setTimeout(()=>{suppressClickAfterDrag=false},0)}});document.addEventListener('pointercancel',()=>{dragSelection=null});window.addEventListener('blur',()=>{dragSelection=null});results.addEventListener('dragstart',event=>{if(event.target.closest('.thumb'))event.preventDefault()});
    async function loadNextPage(){if(!apiBase){setStatus('config.js にCloudflare WorkerのURLを設定してください。',true);return false;}if(!hasMore)return false;if(loadingPromise)return loadingPromise;const generation=searchGeneration;const page=lastPage+1;loadingPromise=(async()=>{try{const params=new URLSearchParams({q:activeQuery,page:String(page)});if(activePeriod!=='new'){params.set('ranking','1');params.set('period',activePeriod)}const response=await fetch(`${apiBase}/search?${params}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'検索に失敗しました。');if(generation!==searchGeneration)return false;let added=0;for(const video of data.videos){if(loadedIds.has(video.id))continue;loadedIds.add(video.id);videos.push(video);renderCard(video);added++;}lastPage=page;if(!added)hasMore=false;if(data.videos.length===0)hasMore=false;setStatus(`${videos.length} 件を表示中${hasMore?'。下へスクロールすると続きが読み込まれます。':'。これ以上の動画はありません。'}`);updateControls();return added>0}catch(error){if(generation===searchGeneration){hasMore=false;setStatus(error.message,true);updateControls()}return false}finally{loadingPromise=null}})();return loadingPromise;}
    async function startSearch(event,period='new'){event?.preventDefault();activePeriod=period;document.querySelectorAll('.periods button').forEach(button=>button.classList.toggle('active',button.dataset.period===period));if(period!=='new')document.querySelector('#query').value='';searchGeneration++;activeQuery=document.querySelector('#query').value.trim();lastPage=0;hasMore=true;loadingPromise=null;videos.length=0;loadedIds.clear();selected.clear();resolved.clear();selectionAnchorId=null;dragSelection=null;results.replaceChildren();results.innerHTML='<div class="sentinel" id="sentinel"></div>';updateControls();setStatus('検索結果を取得しています…');await loadNextPage();}
    const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&hasMore)loadNextPage()},{rootMargin:'700px'});document.querySelector('#search-form').addEventListener('submit',event=>startSearch(event,'new'));document.querySelectorAll('.periods button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#query').value='';startSearch(null,button.dataset.period)}));document.querySelector('#sentinel')&&observer.observe(document.querySelector('#sentinel'));new MutationObserver(()=>{const sentinel=document.querySelector('#sentinel');if(sentinel&&!sentinel.dataset.observed){sentinel.dataset.observed='1';observer.observe(sentinel)}}).observe(results,{childList:true});
    async function nextAutoVideo(){while(autoNextIndex>=videos.length&&hasMore)await loadNextPage();if(autoNextIndex>=videos.length)return null;return videos[autoNextIndex++]}
    async function previousSlot(slot){if(slot.autoMode){if(slot.history.length<2){setStatus('この動画より前はありません。');return}slot.history.pop();await putVideoInSlot(slot,slot.history.at(-1),true);return}if(slot.playlistIndex<=0){setStatus('選択リストの最初の動画です。');return}slot.playlistIndex--;await putVideoInSlot(slot,slot.playlist[slot.playlistIndex],true)}
    async function nextSlot(slot) {
      if (slot.autoMode) {
        await advanceSlot(slot);
        return;
      }

      if (!Array.isArray(slot.playlist)) {
        console.error('playlist が未設定です:', slot);
        setStatus('エラー：この動画スロットにプレイリストが設定されていません。', true);
        return;
      }

      if (slot.playlistIndex >= slot.playlist.length - 1) {
        setStatus('選択リストの最後の動画です。');
        return;
      }

      slot.playlistIndex++;
      await putVideoInSlot(slot, slot.playlist[slot.playlistIndex], true);
    }
    function mediaProxyUrl(slot,attempt=0){return `${apiBase}/media?src=${encodeURIComponent(slot.directUrl)}&retry=${attempt}`}
