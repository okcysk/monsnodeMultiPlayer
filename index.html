<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Monsnode Multi Player v1.3.8 — Web</title>
  <script src="./config.js"></script>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eff1f5;background:#111318;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 20px;background:#191c23;border-bottom:1px solid #30343d}h1{margin:0;font-size:18px;white-space:nowrap}h1 small{margin-left:5px;color:#aeb4c0;font-size:11px;font-weight:600}.search{display:flex;gap:8px;flex:1;max-width:820px}.search input{min-width:0;flex:1;padding:10px 12px;border:1px solid #454b57;border-radius:8px;background:#101217;color:inherit;font:inherit}.search button,.toolbar button{border:0;border-radius:8px;padding:10px 15px;background:#c4f26a;color:#19210e;font-weight:750;cursor:pointer}.search button:disabled{opacity:.6;cursor:wait}.toolbar{display:flex;align-items:center;gap:10px;margin:18px auto;max-width:1500px;padding:0 18px}.toolbar label,.toolbar span{color:#c6cad2}.toolbar select{padding:8px;border:1px solid #454b57;border-radius:7px;background:#20232a;color:#fff}.toolbar .secondary{background:#30343d;color:#f2f3f6}.toolbar button:disabled{opacity:.45;cursor:not-allowed}.status{max-width:1500px;margin:0 auto 14px;padding:0 18px;color:#aeb4c0}.status.error{color:#ffaaa6}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:1500px;margin:0 auto;padding:0 18px 24px}.card{overflow:hidden;border:1px solid #323741;border-radius:10px;background:#1b1e25}.card.selected{outline:2px solid #c4f26a}.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#08090b}.placeholder{display:grid;place-items:center;color:#808896}.card label{display:flex;gap:10px;align-items:flex-start;padding:10px;cursor:pointer}.card input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:#c4f26a}.title{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;line-height:1.4}.sentinel{grid-column:1/-1;height:2px}.player-view{position:fixed;inset:0;z-index:10;display:none;background:#07080a}.player-view.open{display:grid;grid-template-rows:auto 1fr}.player-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#171a20}.player-head h2{margin:0;font-size:15px}.key-help{flex:1;color:#aeb4c0;font-size:12px}.player-grid{display:grid;gap:3px;min-height:0}.slot{position:relative;min-width:0;min-height:0;background:#000;overflow:hidden}.slot.keyboard-focus{outline:3px solid #c4f26a;outline-offset:-3px}.slot video{width:100%;height:100%;object-fit:contain}.slot-label{position:absolute;left:8px;top:8px;z-index:1;max-width:72%;padding:4px 7px;border-radius:5px;background:#000b;font-size:12px;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot-speed{position:absolute;left:8px;bottom:36px;z-index:2;padding:3px 6px;border-radius:4px;background:#000b;color:#fff;font-size:12px;pointer-events:none}.slot-actions{position:absolute;right:8px;top:8px;z-index:2;display:flex;gap:5px}.slot-actions button,.close{border:1px solid #555b66;border-radius:7px;padding:7px 10px;background:#262a32;color:#fff;cursor:pointer}.close{padding:8px 12px}.empty{grid-column:1/-1;text-align:center;padding:20px;color:#aeb4c0}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.search{width:100%}.toolbar{flex-wrap:wrap;gap:7px}.toolbar button{padding:9px 10px}.results{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 10px 20px}.player-view.open{overflow:auto}.player-grid{overflow:auto}.slot{min-height:230px}.key-help{display:none}}
    .periods{display:flex;gap:5px;flex:none}.periods button{border:1px solid #454b57;border-radius:7px;padding:9px 11px;background:#252932;color:#e8ebf0;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.periods button.active{border-color:#c4f26a;background:#c4f26a;color:#19210e}.periods button:disabled{opacity:.55;cursor:wait}@media(max-width:900px){header{flex-wrap:wrap}.search{max-width:none}.periods{margin-left:auto}}@media(max-width:700px){.periods{margin-left:0}}
  </style>
</head>
<body>
  <header>
    <h1>Monsnode Multi Player <small>v1.3.8</small></h1>
    <form class="search" id="search-form"><input id="query" value="" aria-label="検索語" placeholder="検索語（空欄でトップページ）"><button id="search-button">検索</button></form>
    <nav class="periods" aria-label="動画一覧の期間"><button type="button" data-period="new" class="active">new</button><button type="button" data-period="24h">24h</button><button type="button" data-period="3d">3d</button><button type="button" data-period="7d">7d</button></nav>
  </header>
  <div class="toolbar">
    <label for="slot-count">同時再生数</label>
    <select id="slot-count" aria-label="同時再生数"><option value="1">1</option><option value="4" selected>4</option><option value="9">9</option><option value="16">16</option></select>
    <span id="selection-count">0 / 4 選択</span>
    <button class="secondary" id="clear">選択解除</button>
    <button id="open-selected" disabled>選択した動画を再生</button>
    <button id="open-auto" disabled>順に自動再生</button>
  </div>
  <p class="status" id="status" aria-live="polite">トップページの動画を読み込み中…</p>
  <main class="results" id="results"></main>
  <section class="player-view" id="player-view" aria-label="動画プレーヤー">
    <div class="player-head"><h2 id="player-title">Monsnode Multi Player v1.3.8</h2><span class="key-help">Tab / W A S D: 動画選択 · B / N: 前後の動画 · Z / X: 5秒 · C / V: 30秒 · F: 等速 · G: 2.5倍 · H: 10倍 · Space: 再生/停止</span><button class="close" id="close-player">一覧に戻る</button></div>
    <div class="player-grid" id="player-grid"></div>
  </section>
  <script>
    const apiBase=(window.QUAD_API_BASE||'').replace(/\/$/,'');
    const selected=new Map(),resolved=new Map(),loadedIds=new Set(),videos=[];
    const results=document.querySelector('#results'),status=document.querySelector('#status'),countLabel=document.querySelector('#selection-count');
    const selectedButton=document.querySelector('#open-selected'),autoButton=document.querySelector('#open-auto'),playerView=document.querySelector('#player-view'),slotCount=document.querySelector('#slot-count');
    let activeQuery='',activePeriod='new',lastPage=0,hasMore=true,loadingPromise=null,searchGeneration=0,autoNextIndex=0;
    const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function targetCount(){return Number(slotCount.value)}
    function updateControls(){countLabel.textContent=`${selected.size} / ${targetCount()} 選択`;selectedButton.disabled=selected.size!==targetCount()||[...selected.values()].some(v=>!v.videoUrl);autoButton.disabled=videos.length===0&&!hasMore;}
    function updateGrid(){const grid=document.querySelector('#player-grid'),n=grid.children.length,side=Math.ceil(Math.sqrt(n||1));grid.style.gridTemplateColumns=`repeat(${side},minmax(0,1fr))`;grid.style.gridTemplateRows=`repeat(${side},minmax(0,1fr))`;}
    function renderCard(video){const card=document.createElement('article');card.className='card';const image=video.thumbnail?`<img class="thumb" loading="lazy" src="${esc(video.thumbnail)}" alt="">`:'<div class="thumb placeholder">Thumbnail unavailable</div>';card.innerHTML=`${image}<label><input type="checkbox" data-video-id="${esc(video.id)}" aria-label="動画を選択"><span class="title">${esc(video.title)}</span></label>`;const checkbox=card.querySelector('input');checkbox.checked=selected.has(video.id);card.classList.toggle('selected',checkbox.checked);checkbox.addEventListener('change',()=>selectVideo(video,card,checkbox));results.insertBefore(card,document.querySelector('#sentinel'));}
    function setStatus(text,error=false){status.textContent=text;status.className=error?'status error':'status';}
    async function getResolved(video){if(video.videoUrl)return video.videoUrl;if(resolved.has(video.redirectId))return resolved.get(video.redirectId);const task=(async()=>{const response=await fetch(`${apiBase}/resolve?id=${encodeURIComponent(video.redirectId)}`);const data=await response.json();if(!response.ok)throw new Error(data.diagnostic?`${data.error} Diagnostics: ${JSON.stringify(data.diagnostic)}`:(data.error||'動画リンクを取得できません。'));video.videoUrl=data.videoUrl;return data.videoUrl;})();resolved.set(video.redirectId,task);try{return await task}catch(error){resolved.delete(video.redirectId);throw error;}}
    async function selectVideo(video,card,checkbox){if(checkbox.checked&&selected.size>=targetCount()){checkbox.checked=false;setStatus(`動画は${targetCount()}本まで選択できます。`,true);return;}if(!checkbox.checked){selected.delete(video.id);card.classList.remove('selected');updateControls();return;}selected.set(video.id,video);card.classList.add('selected');setStatus(`動画リンクを取得中: ${video.title}`);updateControls();try{await getResolved(video);if(selected.get(video.id)===video){updateControls();setStatus('選択した動画のリンクを取得しました。')}}catch(error){if(selected.get(video.id)===video){selected.delete(video.id);checkbox.checked=false;card.classList.remove('selected');updateControls();setStatus(error.message,true)}}}
    async function loadNextPage(){if(!apiBase){setStatus('config.js にCloudflare WorkerのURLを設定してください。',true);return false;}if(!hasMore)return false;if(loadingPromise)return loadingPromise;const generation=searchGeneration;const page=lastPage+1;loadingPromise=(async()=>{try{const params=new URLSearchParams({q:activeQuery,page:String(page)});if(activePeriod!=='new'){params.set('ranking','1');params.set('period',activePeriod)}const response=await fetch(`${apiBase}/search?${params}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'検索に失敗しました。');if(generation!==searchGeneration)return false;let added=0;for(const video of data.videos){if(loadedIds.has(video.id))continue;loadedIds.add(video.id);videos.push(video);renderCard(video);added++;}lastPage=page;if(!added)hasMore=false;if(data.videos.length===0)hasMore=false;setStatus(`${videos.length} 件を表示中${hasMore?'。下へスクロールすると続きが読み込まれます。':'。これ以上の動画はありません。'}`);updateControls();return added>0}catch(error){if(generation===searchGeneration){hasMore=false;setStatus(error.message,true);updateControls()}return false}finally{loadingPromise=null}})();return loadingPromise;}
    async function startSearch(event,period='new'){event?.preventDefault();activePeriod=period;document.querySelectorAll('.periods button').forEach(button=>button.classList.toggle('active',button.dataset.period===period));if(period!=='new')document.querySelector('#query').value='';searchGeneration++;activeQuery=document.querySelector('#query').value.trim();lastPage=0;hasMore=true;loadingPromise=null;videos.length=0;loadedIds.clear();selected.clear();resolved.clear();results.replaceChildren();results.innerHTML='<div class="sentinel" id="sentinel"></div>';updateControls();setStatus('検索結果を取得しています…');await loadNextPage();}
    const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&hasMore)loadNextPage()},{rootMargin:'700px'});document.querySelector('#search-form').addEventListener('submit',event=>startSearch(event,'new'));document.querySelectorAll('.periods button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#query').value='';startSearch(null,button.dataset.period)}));document.querySelector('#sentinel')&&observer.observe(document.querySelector('#sentinel'));new MutationObserver(()=>{const sentinel=document.querySelector('#sentinel');if(sentinel&&!sentinel.dataset.observed){sentinel.dataset.observed='1';observer.observe(sentinel)}}).observe(results,{childList:true});
    async function nextAutoVideo(){while(autoNextIndex>=videos.length&&hasMore)await loadNextPage();if(autoNextIndex>=videos.length)return null;return videos[autoNextIndex++]}
    async function previousSlot(slot){if(slot.autoMode){if(slot.history.length<2){setStatus('この動画より前はありません。');return}slot.history.pop();await putVideoInSlot(slot,slot.history.at(-1),true);return}if(slot.playlistIndex<=0){setStatus('選択リストの最初の動画です。');return}slot.playlistIndex--;await putVideoInSlot(slot,slot.playlist[slot.playlistIndex],true)}
    async function nextSlot(slot) {
      if (slot.autoMode) {
        await advanceSlot(slot);
        return;
      }

      if (!Array.isArray(slot.playlist)) {
        console.error('playlist が未設定です:', slot);
        setStatus('エラー：この動画スロットにプレイリストが設定されていません。', true);
        return;
      }

      if (slot.playlistIndex >= slot.playlist.length - 1) {
        setStatus('選択リストの最後の動画です。');
        return;
      }

      slot.playlistIndex++;
      await putVideoInSlot(slot, slot.playlist[slot.playlistIndex], true);
    }
    function mediaProxyUrl(slot,attempt=0){return `${apiBase}/media?src=${encodeURIComponent(slot.directUrl)}&retry=${attempt}`}
    function skipFailedVideo(slot,generation){if(slot.generation!==generation)return;slot.generation++;setStatus(`${slot.current?.title||'動画'}: 読み込みに失敗したため次へ進みます。`,true);if(slot.autoMode)advanceSlot(slot);else nextSlot(slot)}
    function retrySlot(slot,generation){if(slot.generation!==generation||!slot.current)return;if(slot.retryCount<1){slot.retryCount++;slot.label.textContent=`${slot.current.title} — Worker経由で再試行中`;setTimeout(()=>{if(slot.generation!==generation||!slot.current)return;slot.video.src=mediaProxyUrl(slot,slot.retryCount);slot.video.load();slot.video.play().catch(error=>{if(error.name==='NotAllowedError')setStatus('動画上の再生ボタンを押してください。',true)})},350);return}if(!slot.directFallback){slot.directFallback=true;slot.label.textContent=`${slot.current.title} — 直リンクで再試行中`;slot.video.src=slot.directUrl;slot.video.load();slot.video.play().catch(()=>{});return}const mediaError=slot.video.error;const detail=mediaError?`media error ${mediaError.code}${mediaError.message?`: ${mediaError.message}`:''}`:'読み込みに失敗しました';slot.label.textContent=`${slot.current.title} — ${detail}`;setStatus(`${slot.current.title}: ${detail} (再試行後も読み込めませんでした)`,true);skipFailedVideo(slot,generation)}
    async function putVideoInSlot(slot,video,shouldPlay=true){if(!video)return;slot.current=video;const generation=++slot.generation;slot.directUrl='';slot.retryCount=0;slot.directFallback=false;slot.label.textContent=video.title;slot.video.pause();slot.video.removeAttribute('src');slot.video.load();try{const directUrl=await getResolved(video);if(slot.generation!==generation)return;slot.directUrl=directUrl;slot.video.src=mediaProxyUrl(slot);slot.video.load();if(shouldPlay)slot.video.play().catch(error=>{if(slot.generation===generation&&error.name==='NotAllowedError')setStatus('動画上の再生ボタンを押してください。',true)})}catch(error){if(slot.generation===generation){slot.label.textContent=`${video.title} — ${error.message}`;setStatus(error.message,true);skipFailedVideo(slot,generation)}}}
    async function advanceSlot(slot){const video=await nextAutoVideo();if(!video){setStatus('一覧の動画をすべて再生しました。');return}slot.history.push(video);await putVideoInSlot(slot,video,true)}
    function makeSlot(video,index,auto){const element=document.createElement('div');element.className='slot';element.tabIndex=-1;element.innerHTML=`<span class="slot-label"></span><span class="slot-speed">1.00×</span>${auto?'<span class="slot-actions"><button type="button" class="back">Back</button><button type="button" class="next">Next</button></span>':''}<video controls playsinline preload="metadata" tabindex="0"></video>`;const slot={element,video:element.querySelector('video'),label:element.querySelector('.slot-label'),speed:element.querySelector('.slot-speed'),history:[],current:null,directUrl:'',generation:0,retryCount:0,directFallback:false,playlist:[],playlistIndex:index,autoMode:auto};slot.video.addEventListener('ratechange',()=>{slot.speed.textContent=`${slot.video.playbackRate.toFixed(2)}×`});slot.video.addEventListener('error',()=>{if(slot.directUrl)retrySlot(slot,slot.generation)});if(auto){slot.history.push(video);element.querySelector('.next').addEventListener('click',()=>nextSlot(slot));element.querySelector('.back').addEventListener('click',()=>previousSlot(slot));slot.video.addEventListener('ended',()=>advanceSlot(slot))}return slot}
    async function openPlayer(list,auto){if(list.length!==targetCount())return;const grid=document.querySelector('#player-grid');grid.replaceChildren();playerView.classList.add('open');document.querySelector('#player-title').textContent=`Monsnode Multi Player v1.3.8${auto?' · Auto':''}`;autoNextIndex=targetCount();const slots=list.map((v,i)=>makeSlot(v,i,auto));for(const slot of slots){slot.playlist=list;grid.append(slot.element)}updateGrid();focusSlot(slots[0]);await Promise.all(slots.map((slot,index)=>putVideoInSlot(slot,list[index],true)));}
    selectedButton.addEventListener('click',()=>openPlayer([...selected.values()],false));autoButton.addEventListener('click',async()=>{autoButton.disabled=true;const initial=[];while(initial.length<targetCount()){const video=await nextAutoVideo();if(!video)break;initial.push(video)}if(initial.length<targetCount()){autoNextIndex=0;setStatus(`再生には${targetCount()}本必要です。動画を追加で読み込めませんでした。`,true);updateControls();return}openPlayer(initial,true).then(()=>setStatus('順に自動再生中です。各動画は終了時またはNextで次へ進みます。'));updateControls()});
    slotCount.addEventListener('change',()=>{while(selected.size>targetCount()){const last=[...selected.keys()].at(-1);selected.delete(last);const input=document.querySelector(`.card input[data-video-id="${CSS.escape(last)}"]`);if(input){input.checked=false;input.closest('.card').classList.remove('selected')}}updateControls()});
    document.querySelector('#clear').addEventListener('click',()=>{selected.clear();document.querySelectorAll('.card input').forEach(input=>{input.checked=false;input.closest('.card').classList.remove('selected')});updateControls()});
    function focusSlot(slot){if(!slot)return;const element=slot.element||slot;document.querySelectorAll('.slot.keyboard-focus').forEach(item=>item.classList.remove('keyboard-focus'));element.classList.add('keyboard-focus');try{element.focus({preventScroll:true})}catch{element.focus()}}
    function shiftFocus(key,reverse=false){const slots=[...document.querySelectorAll('#player-grid .slot')];if(!slots.length)return;let current=slots.findIndex(slot=>slot.classList.contains('keyboard-focus'));if(current<0)current=0;const firstTop=slots[0].getBoundingClientRect().top,firstNextRow=slots.findIndex(slot=>slot.getBoundingClientRect().top>firstTop+2),columns=firstNextRow<0?slots.length:firstNextRow,row=Math.floor(current/columns),col=current%columns;let next=current;if(key==='Tab')next=(current+(reverse?-1:1)+slots.length)%slots.length;else if(key==='a'&&col>0)next=current-1;else if(key==='d'&&col<columns-1&&current+1<slots.length)next=current+1;else if(key==='w'&&row>0)next=current-columns;else if(key==='s'&&current+columns<slots.length)next=current+columns;if(next!==current)focusSlot(slots[next]);return next!==current}
    function closePlayer(){playerView.classList.remove('open');document.querySelector('#player-grid').replaceChildren()}
    document.querySelector('#close-player').addEventListener('click',closePlayer);
    window.addEventListener('keydown',event=>{
      console.log(
        'key:', event.key,
        'code:', event.code,
        'activeElement:', document.activeElement,
        'playerOpen:', playerView.classList.contains('open'),
        'focusedSlot:', document.querySelector(
          '#player-grid .slot.keyboard-focus'
        )
      );
      const isOpen=playerView.classList.contains('open');if(!isOpen)return;
      const key=event.code?.startsWith('Key')?event.code.slice(3).toLowerCase():String(event.key||'').toLowerCase();
      if(key==='escape'){event.preventDefault();closePlayer();return}
      if(key==='tab'){event.preventDefault();event.stopPropagation();shiftFocus('Tab',event.shiftKey);return}
      if(['w','a','s','d'].includes(key)){event.preventDefault();event.stopPropagation();shiftFocus(key);return}
      const slot=document.querySelector('#player-grid .slot.keyboard-focus');if(!slot)return;
      const video=slot.querySelector('video');
      if(key==='b'||key==='n'){event.preventDefault();event.stopPropagation();if(key==='b')previousSlot(slot);else nextSlot(slot);return}
      if(['z','x','c','v','f','g','h',' '].includes(key)){event.preventDefault();event.stopPropagation();if(key===' '){if(video.paused)video.play().catch(error=>setStatus(error.message,true));else video.pause()}else if(key==='z'||key==='x'||key==='c'||key==='v'){const delta=({z:-5,x:5,c:-30,v:30})[key];video.currentTime=Math.max(0,Math.min(Number.isFinite(video.duration)?video.duration:Infinity,video.currentTime+delta))}else if(key==='f')video.playbackRate=1;else if(key==='g')video.playbackRate=video.playbackRate===2.5?1:2.5;else if(key==='h')video.playbackRate=video.playbackRate===10?1:10}
    },true);
    if(location.protocol==='file:')setStatus('ローカルファイルを直接開かず、GitHub PagesのURLから開いてください。',true);else startSearch();
  </script>
</body>
</html>
